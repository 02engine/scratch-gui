<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google" value="notranslate" />
    <title>02Engine - Run Scratch projects faster</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden !important;
        background-color: #333;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #vite-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #333;
        color: #fff;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        z-index: 999999;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="vite-splash">正在加载 02Engine...</div>
    <script>
      window.SplashEnd = function () {
        var splash = document.getElementById('vite-splash');
        if (splash) splash.style.display = 'none';
      };
    </script>
    <script type="module" src="/src/playground/player.jsx"></script>
  </body>
</html>
